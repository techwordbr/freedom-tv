<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="../../route.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Freedom TV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="tela">
  <div id="fundo">
    <div class="camada" id="camada-a"></div>
    <div class="camada" id="camada-b"></div>
  </div>

  <div class="relogio">
    <div class="hora" id="hora"></div>
    <div class="data" id="data"></div>
  </div>

  <nav class="vidro menu" id="menu">
    <div class="item" data-secao="inicio">
      <svg viewBox="0 0 24 24"><path d="M12 3.2 2.8 11h2.7v9.3h5V14h3v6.3h5V11h2.7z"/></svg><span data-i18n="nav_home">Início</span>
    </div>
    <div class="item" data-secao="apps">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span data-i18n="nav_apps">Apps</span>
    </div>
    <div class="item" data-secao="filmes">
      <svg viewBox="0 0 24 24"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5zm7 3v7l6-3.5z"/></svg><span data-i18n="nav_movies">Filmes e Séries</span>
    </div>
    <div class="item" data-acao="antena">
      <svg viewBox="0 0 24 24"><path d="M17.6 3.4 12 9 6.4 3.4 5 4.8 9.2 9H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-5.2L19 4.8zM4 11h16v8H4z"/></svg><span data-i18n="nav_antenna">TV / Antena</span>
    </div>
    <div class="item" data-acao="entradas">
      <svg viewBox="0 0 24 24"><path d="M3 7h18v8H3zm2 2v4h14V9zM7 17h10v2H7z"/></svg><span data-i18n="nav_inputs">HDMI / Entradas</span>
    </div>
    <div class="item" data-acao="wifi">
      <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 6.6 0 10l2.2 2.2C4.4 9.5 8 7.8 12 7.8s7.6 1.7 9.8 4.4L24 10c-2.7-3.4-7-5.5-12-5.5zm0 6.5c-3.2 0-6 1.3-8 3.5l2.2 2.2c1.4-1.5 3.5-2.5 5.8-2.5s4.4 1 5.8 2.5L20 14.5c-2-2.2-4.8-3.5-8-3.5zm0 6.2a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2z"/></svg><span data-i18n="nav_wifi">Wi-Fi</span>
    </div>
    <div class="item" data-acao="tv">
      <svg viewBox="0 0 24 24"><path d="M3 4h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v8h16V6zm4 1.5h2v2.2a2 2 0 0 1 0 3.6V13H8v-.7a2 2 0 0 1 0-3.6zm6 0h2V9a2 2 0 0 1 0 3.6V13h-2v-.4a2 2 0 0 1 0-3.6z"/></svg><span data-i18n="nav_settings">Ajustes da TV</span>
    </div>
    <div class="item" data-acao="root">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5.5v6c0 5.3 3.4 10.2 8 11.5 4.6-1.3 8-6.2 8-11.5v-6zm-1 14.5-3.5-3.5 1.4-1.4 2.1 2.1 4.6-4.6 1.4 1.4z"/></svg><span data-i18n="nav_root">Tela inicial / Root</span>
    </div>
    <div class="item" data-acao="temas">
      <svg viewBox="0 0 24 24"><path d="M6 7V6a6 6 0 0 1 12 0v1h2.5l-1 14h-15l-1-14zm2 0h8V6a4 4 0 0 0-8 0zm-1 3v2h2v-2zm8 0v2h2v-2z"/></svg><span data-i18n="nav_themes">Trocar tema</span>
    </div>
    <div class="item" data-acao="personalizar">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg><span data-i18n="nav_customize">Personalizar</span>
    </div>
  </nav>

  <p class="dicas" id="dicas"></p>

  <section id="inicio" class="secao">
    <div class="vidro destaque" id="destaque">
      <div class="destaque-texto">
        <p class="rotulo" id="destaque-rotulo"></p>
        <h1 id="destaque-titulo"></h1>
        <p class="sub" id="destaque-sub"></p>
        <span class="pilula" id="destaque-acao"></span>
      </div>
    </div>

    <div class="vidro cartao clima" id="cartao-antena" role="button" tabindex="0" aria-label="Abrir TV / Antena" style="cursor:pointer">
      <div class="astro"></div>
      <div>
        <p class="cidade" data-i18n="nav_antenna">TV / Antena</p>
        <p class="graus" style="font-size:38px">Canais</p>
        <p class="ceu">Abrir TV ao vivo ›</p>
      </div>
    </div>
    <div class="vidro cartao entradas" id="entradas" role="button" tabindex="0" aria-label="Escolher entrada HDMI" style="cursor:pointer">
      <p class="cidade" data-i18n="nav_inputs">Entradas</p>
      <p class="fonte">
        <svg viewBox="0 0 24 24"><path d="M3 7h18v8H3zm2 2v4h14V9zM7 17h10v2H7z"/></svg>
        TV / HDMI <span>›</span>
      </p>
    </div>

    <h3 class="titulo-linha" style="top: 556px">Seus aplicativos</h3>
    <div class="janela-linha" style="top: 580px"><div class="linha" id="linha-fav"></div></div>

    <h3 class="titulo-linha" style="top: 818px">Todos os apps</h3>
    <div class="janela-linha" style="top: 842px"><div class="linha" id="linha-todos"></div></div>
  </section>

  <section id="secao-grade" class="secao escondida">
    <div class="vidro painel-grade"></div>
    <h2 class="titulo-secao" id="titulo-grade"></h2>
    <div class="janela-grade"><div class="grade" id="grade"></div></div>
    <p class="vazio" id="vazio-grade"></p>
  </section>

  <div id="lente"></div>

  <aside class="vidro ajustes" id="ajustes">
    <h2 data-i18n="nav_customize">Personalizar</h2>
    <div id="linhas"></div>
    <p class="nota" id="nota"></p>
  </aside>

  <div class="vidro toast" id="toast"></div>
</div>

<script src="../../i18n.js"></script>
<script src="js/apps.js"></script><script src="lg-icons/catalog.js"></script><script src="js/webos.js"></script>
<script src="js/fundo.js"></script>
<script src="js/ajustes.js"></script>
<script src="../../wifi-overlay.js"></script><script src="js/main.js"></script>
<script src="../../health.js"></script></body>
</html>
